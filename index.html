<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الورد">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>الورد</title>
<style>
  :root { --bg: #f7f7f7; --track: #ffffff; }
  :root.dark { --bg: #121212; --track: #262626; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden;
    cursor: pointer;
  }
  svg { width: min(86vw, 62vh); height: auto; display: block; }
  circle { fill: none; transform: rotate(-90deg); transform-origin: 430px 425px; }
  #pct {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800; fill: #6fbf44; direction: ltr;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<svg viewBox="40 40 780 770" aria-label="الورد">
  <circle id="thin"  cx="430" cy="425" r="377" stroke="#6fbf44" stroke-width="13" pathLength="100"/>
  <circle id="track" cx="430" cy="425" r="296" style="stroke: var(--track)" stroke-width="87" pathLength="100"/>
  <circle id="prog"  cx="430" cy="425" r="297" stroke="#6fbf44" stroke-width="44" pathLength="100"/>
  <text id="pct" x="430" y="425" text-anchor="middle" dominant-baseline="central" font-size="170">0.0%</text>
</svg>
<script>
(function () {
  var MAX = 1000, KEY = "alward-count";
  var count = 0;
  try { count = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  if (count < 0 || count >= MAX) count = 0;

  var thin = document.getElementById("thin"),
      track = document.getElementById("track"),
      prog = document.getElementById("prog"),
      pct = document.getElementById("pct");

  function arc(el, from, len) {
    if (len <= 0) { el.setAttribute("stroke-dasharray", "0 100"); return; }
    el.setAttribute("stroke-dasharray", len + " " + (100 - len));
    el.setAttribute("stroke-dashoffset", -from);
  }
  function render() {
    var p = count / MAX * 100;
    arc(prog, 0, p);
    arc(track, p, 100 - p);
    arc(thin, p, 100 - p);
    pct.textContent = (count / 10).toFixed(1) + "%";
  }
  function save() { try { localStorage.setItem(KEY, count); } catch (e) {} }

  function tap() {
    if (count >= MAX) count = 0;
    count++;
    render(); save();
    if (count === MAX) {
      if (navigator.vibrate) navigator.vibrate(200);
      beep();
      setTimeout(function () {
        if (count === MAX) { count = 0; render(); save(); }
      }, 800);
    }
  }
  var audio = null;
  function beep() {
    try {
      if (!audio) return;
      if (audio.state === "suspended") audio.resume();
      [0, 0.28, 0.56].forEach(function (t) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(audio.destination);
        var now = audio.currentTime + t;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        o.start(now); o.stop(now + 0.25);
      });
    } catch (e) {}
  }

  var meta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(dark) {
    document.documentElement.classList.toggle("dark", dark);
    meta.setAttribute("content", dark ? "#121212" : "#f7f7f7");
  }
  var dark = false;
  try { dark = localStorage.getItem("alward-dark") === "1"; } catch (e) {}
  applyTheme(dark);

  var holdTimer = null, longPressed = false;
  document.body.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    }
    longPressed = false;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () {
      longPressed = true;
      dark = !dark;
      applyTheme(dark);
      try { localStorage.setItem("alward-dark", dark ? "1" : "0"); } catch (err) {}
      if (navigator.vibrate) navigator.vibrate(60);
    }, 3000);
  });
  document.body.addEventListener("pointerup", function (e) {
    e.preventDefault();
    clearTimeout(holdTimer);
    if (!longPressed) tap();
    longPressed = false;
  });
  document.body.addEventListener("pointercancel", function () {
    clearTimeout(holdTimer); longPressed = false;
  });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  render();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
})();
</script>
</body>
</html>
